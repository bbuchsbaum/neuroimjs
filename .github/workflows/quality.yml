name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run of the optional network job against the real atlas files.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    if: github.event_name != 'schedule'
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
            canonical: true
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 26
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:types
      - if: matrix.canonical
        run: npm run lint:ci
      - run: npm test -- --run --silent
      - run: npm run build
      - if: matrix.canonical
        run: npm run build:vite
      - if: matrix.canonical
        run: npm run check:bundle-size
      - if: matrix.canonical
        run: npm run test:package
      - if: matrix.canonical
        run: npm run audit:prod

  browser:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The MNI152 template the fixtures load is copied from the committed
      # docs/public/data/mni152_t1.nii.gz (SHA-256 checked) by the Playwright
      # globalSetup, so no download is needed.
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
            e2e/**/*-snapshots/
          retention-days: 14

  # Downstream contract tests: each known consumer's call surface (neuromosaic,
  # FROIAtlas, neuroimjs-vscode, xnat2bids) against the packed tarball.
  consumers:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run build:vite
      - run: npm run test:consumers
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-contract-results
          path: test-results/consumers/
          retention-days: 14

  # Optional: the atlas loaders against the real Glasser/Schaefer downloads.
  # The default suite serves synthetic files with the same geometry and label
  # formats (tests/helpers/syntheticAtlas.ts). Runs weekly and on manual
  # dispatch only, so upstream outages cannot block pull requests.
  network:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      NEUROIMJS_NETWORK_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/NeuroAtlas.test.ts tests/DenseNeuroVol.test.ts tests/SliceTransform.test.ts

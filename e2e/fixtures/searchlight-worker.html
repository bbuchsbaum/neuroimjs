<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Searchlight worker parity</title>
  </head>
  <body>
    <div id="status">running</div>
    <script type="module">
      import {
        FloatNeuroVol,
        NeuroSpace,
        searchlightCoords,
        searchlightIterator,
      } from '../../src/browser';

      const status = document.querySelector('#status');
      const transform = [
        [1, 0.25, 0, 11],
        [0, 2, 0.1, -7],
        [0, 0, 3, 4],
        [0, 0, 0, 1],
      ];
      const space = new NeuroSpace(
        [5, 4, 3],
        [1, 2, 3],
        [11, -7, 4],
        undefined,
        transform,
      );
      const data = new Float32Array(space.size);
      for (let index = 0; index < data.length; index++) {
        data[index] = index % 3 === 0 ? 1 : 0;
      }
      const mask = new FloatNeuroVol(space, data);
      const progress = [];

      try {
        if (typeof Worker === 'undefined') throw new Error('Worker is unavailable');
        const sequential = searchlightIterator(mask, 2.25, {
          eager: true,
          nonzero: true,
          cores: 1,
        });
        const parallel = await searchlightIterator(mask, 2.25, {
          eager: true,
          nonzero: true,
          cores: 2,
          onProgress: value => progress.push(value),
        });
        const sequentialCoords = await searchlightCoords(mask, 2.25, {
          nonzero: true,
          cores: 1,
        });
        const parallelCoords = await searchlightCoords(mask, 2.25, {
          nonzero: true,
          cores: 2,
        });

        const same = parallel.length === sequential.length && parallel.every((roi, index) => {
          const expected = sequential[index];
          return roi.parentIndex === expected.parentIndex &&
            roi.centerIndex === expected.centerIndex &&
            JSON.stringify(roi.coords) === JSON.stringify(expected.coords) &&
            JSON.stringify(Array.from(roi.data)) === JSON.stringify(Array.from(expected.data)) &&
            JSON.stringify(roi.space.getTrans().to2DArray()) === JSON.stringify(transform) &&
            JSON.stringify(Array.from(parallelCoords.get(index))) ===
              JSON.stringify(Array.from(sequentialCoords.get(index)));
        });
        if (!same) throw new Error('Parallel results differ from the sequential oracle');
        if (progress.at(-1) !== 1) throw new Error('Progress did not finish at 1');

        // Clipping can remove an out-of-mask centre. The worker must retain
        // sphericalROI's nearest-member centre fallback, including ties, and
        // reject entirely empty clipped spheres through both public APIs.
        const edgeSpace = new NeuroSpace([2, 1, 1], [1, 1, 1], [0, 0, 0]);
        const edgeMask = new FloatNeuroVol(edgeSpace, new Float32Array([0, 1]));
        const edgeOptions = { eager: true, nonzero: false, clipToMask: true };
        const edgeSequential = searchlightIterator(edgeMask, 1, { ...edgeOptions, cores: 1 });
        const edgeParallel = await searchlightIterator(edgeMask, 1, { ...edgeOptions, cores: 2 });
        const edgeCoordsSequential = await searchlightCoords(edgeMask, 1, { nonzero: false, clipToMask: true, cores: 1 });
        const edgeCoordsParallel = await searchlightCoords(edgeMask, 1, { nonzero: false, clipToMask: true, cores: 2 });
        const expectedEdge = JSON.stringify([[1, 0, 0]]);
        const sameEdge = edgeParallel.length === 2 && edgeParallel.every((roi, index) =>
          JSON.stringify(roi.coords) === expectedEdge && roi.centerIndex === 0 &&
          JSON.stringify(Array.from(edgeCoordsParallel.get(index))) ===
            JSON.stringify(Array.from(edgeCoordsSequential.get(index)))
        );
        if (!sameEdge || edgeSequential.some((roi) => JSON.stringify(roi.coords) !== expectedEdge || roi.centerIndex !== 0)) {
          throw new Error('Clipped-centre worker fallback differs from sphericalROI');
        }

        const tiedSpace = new NeuroSpace([3, 1, 1], [1, 1, 1], [0, 0, 0]);
        const tiedMask = new FloatNeuroVol(tiedSpace, new Float32Array([1, 0, 1]));
        const tiedSequential = searchlightIterator(tiedMask, 1, { ...edgeOptions, cores: 1 });
        const tiedParallel = await searchlightIterator(tiedMask, 1, { ...edgeOptions, cores: 2 });
        const tiedCoords = JSON.stringify([[0, 0, 0], [2, 0, 0]]);
        if (JSON.stringify(tiedSequential[1].coords) !== tiedCoords || tiedSequential[1].centerIndex !== 0 ||
            JSON.stringify(tiedParallel[1].coords) !== tiedCoords || tiedParallel[1].centerIndex !== 0) {
          throw new Error('Worker did not retain spherical iteration order for a nearest-member tie');
        }

        const emptyMask = new FloatNeuroVol(edgeSpace, new Float32Array(2));
        const emptyIterator = () => searchlightIterator(emptyMask, 1, { ...edgeOptions, cores: 1 });
        if (!(() => { try { emptyIterator(); return false; } catch { return true; } })()) {
          throw new Error('Sequential iterator accepted an empty clipped sphere');
        }
        const emptyCoords = await searchlightCoords(emptyMask, 1, { nonzero: false, clipToMask: true, cores: 1 });
        if (!(() => { try { emptyCoords.get(0); return false; } catch { return true; } })()) {
          throw new Error('Sequential coordinates accepted an empty clipped sphere');
        }
        try {
          await searchlightIterator(emptyMask, 1, { ...edgeOptions, cores: 2 });
          throw new Error('Parallel iterator accepted an empty clipped sphere');
        } catch (error) {
          if (!String(error).includes('No voxels found within the specified sphere')) throw error;
        }
        try {
          await searchlightCoords(emptyMask, 1, { nonzero: false, clipToMask: true, cores: 2 });
          throw new Error('Parallel coordinates accepted an empty clipped sphere');
        } catch (error) {
          if (!String(error).includes('No voxels found within the specified sphere')) throw error;
        }

        window.searchlightWorkerResult = {
          count: parallel.length,
          edgeCount: edgeParallel.length,
          progress,
          workerSupported: true,
        };
        status.textContent = 'passed';
      } catch (error) {
        window.searchlightWorkerResult = { error: String(error) };
        status.textContent = 'failed';
      }
    </script>
  </body>
</html>
